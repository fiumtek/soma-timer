<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빗썸 ↔ Gate.io 차익거래 모니터</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
      background: #0a0e14; color: #c9d1d9; min-height: 100vh;
    }
    .hdr {
      background: linear-gradient(135deg, #111820, #161f2b);
      border-bottom: 1px solid #1e2a3a;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
    }
    .hdr h1 { font-size: 16px; color: #e6edf3; letter-spacing: -0.3px; }
    .stats { display: flex; gap: 14px; font-size: 12px; color: #7d8590; flex-wrap: wrap; align-items: center; }
    .stats .v { color: #e6edf3; font-weight: 600; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
    .dot-on { background: #3fb950; box-shadow: 0 0 6px #3fb95080; }
    .dot-off { background: #f85149; }
    .dot-load { background: #d29922; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    .wrap { overflow-x: auto; padding: 12px 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead th {
      background: #111820; color: #7d8590; padding: 8px 10px;
      text-align: right; border-bottom: 2px solid #1e2a3a;
      white-space: nowrap; cursor: pointer; user-select: none;
      position: sticky; top: 0; z-index: 2;
      font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .3px;
    }
    thead th:first-child { text-align: left; }
    thead th:hover { color: #e6edf3; }
    thead th .a { font-size: 9px; margin-left: 2px; opacity: .7; }
    tbody tr { border-bottom: 1px solid #151d27; transition: background .12s; }
    tbody tr:hover { background: #131a24; }
    tbody tr.hi { background: #0d2818; }
    tbody td { padding: 7px 10px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    tbody td:first-child { text-align: left; font-weight: 700; color: #e6edf3; font-size: 13px; }
    .pos { color: #3fb950; } .neg { color: #f85149; } .dim { color: #484f58; }
    .dir { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 11px; font-weight: 700; }
    .dg { background: #0c2d6b; color: #58a6ff; }
    .db { background: #3d2800; color: #d29922; }
    .st { display: inline-block; font-size: 11px; font-weight: 700; }
    .st-ok { color: #3fb950; } .st-no { color: #f85149; }
    .io { display: flex; gap: 4px; justify-content: center; }
    .bar { display: inline-block; height: 14px; border-radius: 2px; vertical-align: middle; margin-right: 4px; min-width: 2px; }
    .bp { background: #238636; } .bn { background: #6e2b2b; }
    .empty { text-align: center; padding: 60px 20px; color: #484f58; }
    .spin { display: inline-block; width: 22px; height: 22px; border: 2px solid #1e2a3a; border-top-color: #58a6ff; border-radius: 50%; animation: sp .7s linear infinite; margin-bottom: 10px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .ft { text-align: center; padding: 12px; font-size: 11px; color: #30363d; border-top: 1px solid #151d27; }
    @keyframes flash { 0% { background: #1a2636; } 100% { background: transparent; } }
    .flash td { animation: flash .5s ease-out; }
    .err { background: #3d1117; border: 1px solid #f8514930; color: #f85149; padding: 10px 16px; margin: 12px 16px; border-radius: 6px; font-size: 12px; }
    @media (max-width: 768px) {
      .hdr { padding: 10px 12px; }
      .wrap { padding: 6px; }
      table { font-size: 11px; }
      thead th, tbody td { padding: 5px 6px; }
    }
  </style>
</head>
<body>
<div class="hdr">
  <h1>빗썸 ↔ Gate.io 차익거래</h1>
  <div class="stats">
    <span><span class="dot dot-load" id="dot"></span><span id="stxt">연결 중</span></span>
    <span>USDT <span class="v" id="rate">-</span>원</span>
    <span>렌딩 <span class="v" id="lcnt">-</span></span>
    <span>수익+ <span class="v pos" id="pcnt">0</span></span>
    <span>갱신 <span class="v" id="upd">-</span></span>
  </div>
</div>
<div id="errBox"></div>
<div class="wrap">
  <div class="empty" id="loading"><div class="spin"></div><div>서버 연결 중...</div></div>
  <table id="tbl" style="display:none">
    <thead><tr>
      <th data-k="symbol"># 코인<span class="a"></span></th>
      <th data-k="buyPrice">매수가(KRW)<span class="a"></span></th>
      <th data-k="sellPrice">매도가(KRW)<span class="a"></span></th>
      <th data-k="priceDiff">차이(KRW)<span class="a"></span></th>
      <th data-k="direction">방향<span class="a"></span></th>
      <th data-k="grossPct">총수익률<span class="a"></span></th>
      <th data-k="netPct">순수익률<span class="a"></span></th>
      <th data-k="profitPer1M">100만원당<span class="a"></span></th>
      <th data-k="bIO">빗썸 입출금<span class="a"></span></th>
      <th data-k="gIO">Gate 입출금<span class="a"></span></th>
      <th data-k="bVol">빗썸거래량<span class="a"></span></th>
    </tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="empty" id="nodata" style="display:none">현재 양의 수익률을 가진 차익거래 기회가 없습니다.</div>
</div>
<div class="ft">bid/ask 기반 실계산 | 수수료 빗썸 0.25% + Gate 0.2% = 0.45% 반영 | 3초 갱신</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let sortKey = 'netPct', sortDir = -1, prevSyms = new Set(), pairs = [];

  // ── Format helpers ──
  function fK(n) { const a=Math.abs(n); if(a>=1e8) return (n/1e8).toFixed(2)+'억'; if(a>=1e4) return (n/1e4).toFixed(0)+'만'; return n.toLocaleString('ko-KR'); }
  function fP(n) { if(n>=1000) return Math.round(n).toLocaleString('ko-KR'); if(n>=1) return n.toFixed(2); if(n>=.01) return n.toFixed(4); return n.toFixed(6); }
  function fPct(n) { return '<span class="'+(n>0?'pos':n<0?'neg':'dim')+'">'+(n>0?'+':'')+n.toFixed(3)+'%</span>'; }
  function fVol(n) { if(n>=1e12) return (n/1e12).toFixed(1)+'조'; if(n>=1e8) return (n/1e8).toFixed(1)+'억'; if(n>=1e4) return (n/1e4).toFixed(0)+'만'; return Math.round(n).toLocaleString('ko-KR'); }

  // ── Render ──
  function render() {
    document.querySelectorAll('thead th').forEach(th => {
      const ar = th.querySelector('.a');
      ar.textContent = th.dataset.k === sortKey ? (sortDir===-1?' ▼':' ▲') : '';
    });
    const list = [...pairs].sort((a,b) => {
      let va=a[sortKey], vb=b[sortKey];
      if (sortKey==='bIO') { va=(a.bDep?1:0)+(a.bWth?1:0); vb=(b.bDep?1:0)+(b.bWth?1:0); }
      if (sortKey==='gIO') { va=(a.gDep?1:0)+(a.gWth?1:0); vb=(b.gDep?1:0)+(b.gWth?1:0); }
      if (typeof va==='string') return sortDir*va.localeCompare(vb);
      return sortDir*((va||0)-(vb||0));
    });
    if (!list.length) {
      $('tbl').style.display='none'; $('loading').style.display='none'; $('nodata').style.display='';
      return;
    }
    $('loading').style.display='none'; $('nodata').style.display='none'; $('tbl').style.display='';
    const mx = Math.max(...list.map(p=>Math.abs(p.netPct)), 0.1);
    const newSyms = new Set(list.map(p=>p.symbol));
    $('body').innerHTML = list.map((p,i) => {
      const isNew = !prevSyms.has(p.symbol);
      const dc = p.direction.startsWith('Gate')?'dg':'db';
      const bw = Math.max(2, Math.round((Math.abs(p.netPct)/mx)*40));
      return '<tr class="'+(isNew?'flash':'')+' '+(p.netPct>1?'hi':'')+'">'+
        '<td>'+(i+1)+'. '+p.symbol+'</td>'+
        '<td>'+fP(p.buyPrice)+'</td>'+
        '<td>'+fP(p.sellPrice)+'</td>'+
        '<td class="'+(p.priceDiff>0?'pos':'neg')+'">'+(p.priceDiff>0?'+':'')+fK(p.priceDiff)+'</td>'+
        '<td><span class="dir '+dc+'">'+p.direction+'</span></td>'+
        '<td>'+fPct(p.grossPct)+'</td>'+
        '<td><span class="bar '+(p.netPct>0?'bp':'bn')+'" style="width:'+bw+'px"></span>'+fPct(p.netPct)+'</td>'+
        '<td class="'+(p.profitPer1M>0?'pos':'neg')+'">'+(p.profitPer1M>0?'+':'')+fK(p.profitPer1M)+'원</td>'+
        '<td><div class="io"><span class="st '+(p.bDep?'st-ok':'st-no')+'">입'+(p.bDep?'O':'X')+'</span><span class="st '+(p.bWth?'st-ok':'st-no')+'">출'+(p.bWth?'O':'X')+'</span></div></td>'+
        '<td><div class="io"><span class="st '+(p.gDep?'st-ok':'st-no')+'">입'+(p.gDep?'O':'X')+'</span><span class="st '+(p.gWth?'st-ok':'st-no')+'">출'+(p.gWth?'O':'X')+'</span></div></td>'+
        '<td class="dim">'+fVol(p.bVol)+'</td>'+
      '</tr>';
    }).join('');
    prevSyms = newSyms;
  }

  function onData(d) {
    if (!d || !d.pairs) return;
    pairs = d.pairs;
    $('rate').textContent = (d.usdtKrw||0).toLocaleString('ko-KR');
    $('lcnt').textContent = d.lendingCount||'-';
    $('pcnt').textContent = d.positiveCount||0;
    $('upd').textContent = d.timestamp ? new Date(d.timestamp).toLocaleTimeString('ko-KR') : '-';
    $('dot').className = 'dot dot-on';
    $('stxt').textContent = '실시간';
    $('errBox').innerHTML = d.error ? '<div class="err">'+d.error+'</div>' : '';
    render();
  }

  // ── Sort ──
  document.querySelectorAll('thead th[data-k]').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=k==='symbol'?1:-1; }
      render();
    });
  });

  // ── WebSocket + REST fallback ──
  let ws, wsDelay = 1000;

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    try { ws = new WebSocket(proto + '//' + location.host); } catch { setTimeout(connectWS, wsDelay); return; }
    ws.onopen = function() {
      wsDelay = 1000;
      $('dot').className = 'dot dot-on';
      $('stxt').textContent = '실시간';
    };
    ws.onmessage = function(ev) {
      try { onData(JSON.parse(ev.data)); } catch {}
    };
    ws.onclose = function() {
      $('dot').className = 'dot dot-off';
      $('stxt').textContent = '재연결 중';
      setTimeout(connectWS, wsDelay);
      wsDelay = Math.min(wsDelay * 1.5, 10000);
    };
    ws.onerror = function() {};
  }

  // REST polling as backup (every 5s when WS is down)
  setInterval(async function() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    try {
      const res = await fetch('/api/arbitrage', { signal: AbortSignal.timeout(5000) });
      if (res.ok) onData(await res.json());
    } catch {}
  }, 5000);

  // Initial REST fetch (fast first paint)
  fetch('/api/arbitrage').then(r => r.json()).then(onData).catch(() => {});
  connectWS();
})();
</script>
</body>
</html>
