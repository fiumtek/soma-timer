<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빗썸 ↔ Gate.io 차익거래 모니터</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }

    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header h1 {
      font-size: 18px;
      color: #f0f6fc;
    }

    .header-info {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: #8b949e;
      flex-wrap: wrap;
    }

    .header-info span { white-space: nowrap; }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }

    .status-dot.connected { background: #3fb950; }
    .status-dot.disconnected { background: #f85149; }

    .controls {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 24px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 13px;
      color: #8b949e;
    }

    .controls input, .controls select {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
    }

    .controls input:focus, .controls select:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .table-wrapper {
      overflow-x: auto;
      padding: 16px 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      background: #161b22;
      color: #8b949e;
      padding: 10px 12px;
      text-align: right;
      border-bottom: 1px solid #30363d;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    thead th:first-child { text-align: left; }

    thead th:hover { color: #f0f6fc; }

    thead th .sort-arrow {
      margin-left: 4px;
      font-size: 10px;
    }

    tbody tr {
      border-bottom: 1px solid #21262d;
      transition: background 0.15s;
    }

    tbody tr:hover { background: #161b22; }

    tbody td {
      padding: 8px 12px;
      text-align: right;
      white-space: nowrap;
    }

    tbody td:first-child {
      text-align: left;
      font-weight: 600;
      color: #f0f6fc;
    }

    .positive { color: #3fb950; }
    .negative { color: #f85149; }
    .neutral  { color: #8b949e; }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-ok {
      background: #0d3320;
      color: #3fb950;
    }

    .badge-no {
      background: #3d1117;
      color: #f85149;
    }

    .direction {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 600;
    }

    .dir-gate {
      background: #0c2d6b;
      color: #58a6ff;
    }

    .dir-bithumb {
      background: #3d2800;
      color: #d29922;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #8b949e;
      font-size: 15px;
    }

    .loading .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #484f58;
      border-top: 1px solid #21262d;
    }

    @media (max-width: 768px) {
      .header { padding: 12px 16px; }
      .controls { padding: 8px 16px; }
      .table-wrapper { padding: 8px; }
      table { font-size: 12px; }
      thead th, tbody td { padding: 6px 8px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>빗썸 ↔ Gate.io 차익거래 모니터</h1>
  <div class="header-info">
    <span><span class="status-dot disconnected" id="wsStatus"></span> <span id="wsText">연결 중...</span></span>
    <span>USDT/KRW: <strong id="usdtRate">-</strong></span>
    <span>렌딩 코인: <strong id="lendingCount">-</strong></span>
    <span>매칭: <strong id="matchedCount">-</strong></span>
    <span>갱신: <strong id="lastUpdate">-</strong></span>
  </div>
</div>

<div class="controls">
  <label>검색:</label>
  <input type="text" id="search" placeholder="코인명..." />
  <label>최소 수익률:</label>
  <input type="number" id="minProfit" value="-10" step="0.1" style="width:70px" /> <span style="font-size:13px;color:#8b949e">%</span>
  <label>입출금 가능만:</label>
  <input type="checkbox" id="onlyActive" />
  <label>양수 수익만:</label>
  <input type="checkbox" id="onlyPositive" />
</div>

<div class="table-wrapper">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>데이터 로딩 중...</div>
  </div>
  <table id="dataTable" style="display:none">
    <thead>
      <tr>
        <th data-sort="symbol">코인 <span class="sort-arrow"></span></th>
        <th data-sort="bithumbPrice">빗썸(KRW) <span class="sort-arrow"></span></th>
        <th data-sort="gateioKrw">Gate.io(KRW) <span class="sort-arrow"></span></th>
        <th data-sort="gateioPrice">Gate.io(USDT) <span class="sort-arrow"></span></th>
        <th data-sort="priceDiff">가격차(KRW) <span class="sort-arrow"></span></th>
        <th data-sort="direction">방향 <span class="sort-arrow"></span></th>
        <th data-sort="grossPct">수익률(총) <span class="sort-arrow"></span></th>
        <th data-sort="netPct">수익률(순) <span class="sort-arrow"></span></th>
        <th data-sort="profitPer1M">수익/100만 <span class="sort-arrow"></span></th>
        <th data-sort="bithumbVolume24h">빗썸거래량 <span class="sort-arrow"></span></th>
        <th data-sort="depositStatus">입금 <span class="sort-arrow"></span></th>
        <th data-sort="withdrawalStatus">출금 <span class="sort-arrow"></span></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="footer">
  수수료: 빗썸 0.25% + Gate.io 0.2% = 0.45% 반영 | 8초 간격 자동 갱신 | Gate.io 렌딩 가능 코인만 표시
</div>

<script>
(function() {
  let data = null;
  let sortKey = 'netPct';
  let sortDir = -1; // -1 = desc, 1 = asc
  let ws = null;
  let reconnectTimer = null;

  const $ = (id) => document.getElementById(id);

  // --- Format helpers ---
  function fmtKRW(n) {
    if (n == null) return '-';
    if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(2) + '억';
    if (Math.abs(n) >= 1e4) return (n / 1e4).toFixed(0) + '만';
    return n.toLocaleString('ko-KR');
  }

  function fmtPrice(n) {
    if (n == null) return '-';
    if (n >= 1000) return Math.round(n).toLocaleString('ko-KR');
    if (n >= 1) return n.toFixed(2);
    if (n >= 0.01) return n.toFixed(4);
    return n.toFixed(6);
  }

  function fmtPct(n) {
    if (n == null) return '-';
    const cls = n > 0 ? 'positive' : n < 0 ? 'negative' : 'neutral';
    const sign = n > 0 ? '+' : '';
    return `<span class="${cls}">${sign}${n.toFixed(2)}%</span>`;
  }

  function fmtVolume(n) {
    if (n == null) return '-';
    if (n >= 1e12) return (n / 1e12).toFixed(1) + '조';
    if (n >= 1e8) return (n / 1e8).toFixed(1) + '억';
    if (n >= 1e4) return (n / 1e4).toFixed(0) + '만';
    return Math.round(n).toLocaleString('ko-KR');
  }

  // --- Filtering ---
  function getFiltered(pairs) {
    const search = $('search').value.toUpperCase().trim();
    const minProfit = parseFloat($('minProfit').value) || -999;
    const onlyActive = $('onlyActive').checked;
    const onlyPositive = $('onlyPositive').checked;

    return pairs.filter(p => {
      if (search && !p.symbol.includes(search)) return false;
      if (p.netPct < minProfit) return false;
      if (onlyActive && (!p.depositStatus || !p.withdrawalStatus)) return false;
      if (onlyPositive && p.netPct <= 0) return false;
      return true;
    });
  }

  // --- Sorting ---
  function sortPairs(pairs) {
    return pairs.sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (typeof va === 'string') {
        return sortDir * va.localeCompare(vb);
      }
      if (typeof va === 'boolean') {
        va = va ? 1 : 0;
        vb = vb ? 1 : 0;
      }
      return sortDir * (va - vb);
    });
  }

  // --- Render ---
  function render() {
    if (!data || !data.pairs) return;

    $('usdtRate').textContent = data.usdtKrw ? data.usdtKrw.toLocaleString('ko-KR') + '원' : '-';
    $('lendingCount').textContent = data.lendingCount || '-';
    $('matchedCount').textContent = data.matchedCount || '-';
    if (data.timestamp) {
      const d = new Date(data.timestamp);
      $('lastUpdate').textContent = d.toLocaleTimeString('ko-KR');
    }

    let filtered = getFiltered(data.pairs);
    filtered = sortPairs(filtered);

    // Update sort arrows
    document.querySelectorAll('thead th').forEach(th => {
      const arrow = th.querySelector('.sort-arrow');
      if (th.dataset.sort === sortKey) {
        arrow.textContent = sortDir === -1 ? '▼' : '▲';
      } else {
        arrow.textContent = '';
      }
    });

    const tbody = $('tableBody');
    tbody.innerHTML = filtered.map(p => {
      const dirClass = p.direction.startsWith('Gate') ? 'dir-gate' : 'dir-bithumb';
      const profitClass = p.profitPer1M > 0 ? 'positive' : p.profitPer1M < 0 ? 'negative' : 'neutral';
      const diffClass = p.priceDiff > 0 ? 'positive' : p.priceDiff < 0 ? 'negative' : 'neutral';

      return `<tr>
        <td>${p.symbol}</td>
        <td>${fmtPrice(p.bithumbPrice)}</td>
        <td>${fmtPrice(p.gateioKrw)}</td>
        <td>${fmtPrice(p.gateioPrice)}</td>
        <td class="${diffClass}">${p.priceDiff > 0 ? '+' : ''}${fmtKRW(p.priceDiff)}</td>
        <td><span class="direction ${dirClass}">${p.direction}</span></td>
        <td>${fmtPct(p.grossPct)}</td>
        <td>${fmtPct(p.netPct)}</td>
        <td class="${profitClass}">${p.profitPer1M > 0 ? '+' : ''}${fmtKRW(p.profitPer1M)}원</td>
        <td>${fmtVolume(p.bithumbVolume24h)}</td>
        <td><span class="badge ${p.depositStatus ? 'badge-ok' : 'badge-no'}">${p.depositStatus ? '가능' : '불가'}</span></td>
        <td><span class="badge ${p.withdrawalStatus ? 'badge-ok' : 'badge-no'}">${p.withdrawalStatus ? '가능' : '불가'}</span></td>
      </tr>`;
    }).join('');

    $('loading').style.display = 'none';
    $('dataTable').style.display = '';
  }

  // --- Sort click ---
  document.querySelectorAll('thead th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (sortKey === key) {
        sortDir *= -1;
      } else {
        sortKey = key;
        sortDir = key === 'symbol' ? 1 : -1;
      }
      render();
    });
  });

  // --- Filter events ---
  $('search').addEventListener('input', render);
  $('minProfit').addEventListener('input', render);
  $('onlyActive').addEventListener('change', render);
  $('onlyPositive').addEventListener('change', render);

  // --- WebSocket ---
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);

    ws.onopen = () => {
      $('wsStatus').className = 'status-dot connected';
      $('wsText').textContent = '연결됨';
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
    };

    ws.onmessage = (evt) => {
      try {
        data = JSON.parse(evt.data);
        render();
      } catch (e) {
        console.error('Parse error:', e);
      }
    };

    ws.onclose = () => {
      $('wsStatus').className = 'status-dot disconnected';
      $('wsText').textContent = '재연결 중...';
      reconnectTimer = setTimeout(connectWS, 3000);
    };

    ws.onerror = () => {
      ws.close();
    };
  }

  // --- Initial load via REST (fallback) ---
  async function initialLoad() {
    try {
      const res = await fetch('/api/arbitrage');
      const json = await res.json();
      if (json.pairs && json.pairs.length > 0) {
        data = json;
        render();
      }
    } catch (e) {
      console.log('REST fallback failed, waiting for WS');
    }
  }

  initialLoad();
  connectWS();
})();
</script>
</body>
</html>
