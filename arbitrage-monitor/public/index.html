<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빗썸 ↔ Gate.io 차익거래 모니터</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
      background: #0a0e14;
      color: #c9d1d9;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #111820, #161f2b);
      border-bottom: 1px solid #1e2a3a;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header h1 { font-size: 16px; color: #e6edf3; letter-spacing: -0.3px; }
    .header-stats {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: #7d8590;
      flex-wrap: wrap;
      align-items: center;
    }
    .header-stats .stat-val { color: #e6edf3; font-weight: 600; }
    .dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-right: 3px;
      vertical-align: middle;
    }
    .dot.on { background: #3fb950; box-shadow: 0 0 6px #3fb95080; }
    .dot.off { background: #f85149; }

    /* Table */
    .table-wrap {
      overflow-x: auto;
      padding: 12px 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      table-layout: auto;
    }
    thead th {
      background: #111820;
      color: #7d8590;
      padding: 8px 10px;
      text-align: right;
      border-bottom: 2px solid #1e2a3a;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 2;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    thead th:first-child { text-align: left; }
    thead th:hover { color: #e6edf3; }
    thead th .arr { font-size: 9px; margin-left: 2px; opacity: 0.7; }

    tbody tr {
      border-bottom: 1px solid #151d27;
      transition: background 0.12s;
    }
    tbody tr:hover { background: #131a24; }
    tbody tr.highlight { background: #0d2818; }
    tbody td {
      padding: 7px 10px;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    tbody td:first-child {
      text-align: left;
      font-weight: 700;
      color: #e6edf3;
      font-size: 13px;
    }

    .pos { color: #3fb950; }
    .neg { color: #f85149; }
    .dim { color: #484f58; }

    /* Direction badge */
    .dir {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .dir-g { background: #0c2d6b; color: #58a6ff; }
    .dir-b { background: #3d2800; color: #d29922; }

    /* Status badges */
    .st {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .st-ok { color: #3fb950; }
    .st-no { color: #f85149; }

    .io-cell {
      display: flex;
      gap: 4px;
      justify-content: center;
      align-items: center;
    }

    /* Profit bar */
    .profit-bar {
      display: inline-block;
      height: 14px;
      border-radius: 2px;
      vertical-align: middle;
      margin-right: 4px;
      min-width: 2px;
    }
    .profit-bar.pos-bar { background: #238636; }
    .profit-bar.neg-bar { background: #6e2b2b; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #484f58;
    }
    .empty .spinner {
      display: inline-block;
      width: 22px; height: 22px;
      border: 2px solid #1e2a3a;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: sp 0.7s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes sp { to { transform: rotate(360deg); } }

    /* Footer */
    .footer {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      color: #30363d;
      border-top: 1px solid #151d27;
    }

    /* Pulse animation for new data */
    @keyframes flash {
      0% { background: #1a2636; }
      100% { background: transparent; }
    }
    .flash td { animation: flash 0.5s ease-out; }

    @media (max-width: 768px) {
      .header { padding: 10px 12px; }
      .table-wrap { padding: 6px; }
      table { font-size: 11px; }
      thead th, tbody td { padding: 5px 6px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>빗썸 ↔ Gate.io 차익거래</h1>
  <div class="header-stats">
    <span><span class="dot off" id="wsDot"></span><span id="wsTxt">연결 중</span></span>
    <span>USDT <span class="stat-val" id="rate">-</span>원</span>
    <span>렌딩 <span class="stat-val" id="lending">-</span></span>
    <span>수익+ <span class="stat-val pos" id="profitCnt">-</span></span>
    <span>갱신 <span class="stat-val" id="updated">-</span></span>
  </div>
</div>

<div class="table-wrap">
  <div class="empty" id="loading">
    <div class="spinner"></div>
    <div>실시간 차익거래 데이터 로딩 중...</div>
  </div>
  <table id="tbl" style="display:none">
    <thead>
      <tr>
        <th data-k="symbol"># 코인<span class="arr"></span></th>
        <th data-k="buyPrice">매수가(KRW)<span class="arr"></span></th>
        <th data-k="sellPrice">매도가(KRW)<span class="arr"></span></th>
        <th data-k="priceDiff">차이(KRW)<span class="arr"></span></th>
        <th data-k="direction">방향<span class="arr"></span></th>
        <th data-k="grossPct">총수익률<span class="arr"></span></th>
        <th data-k="netPct">순수익률<span class="arr"></span></th>
        <th data-k="profitPer1M">100만원당<span class="arr"></span></th>
        <th data-k="bithumbIO">빗썸 입출금<span class="arr"></span></th>
        <th data-k="gateioIO">Gate 입출금<span class="arr"></span></th>
        <th data-k="bithumbVolume24h">빗썸거래량<span class="arr"></span></th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
  <div class="empty" id="nodata" style="display:none">
    현재 양의 수익률을 가진 차익거래 기회가 없습니다. 실시간 모니터링 중...
  </div>
</div>

<div class="footer">
  bid/ask 기반 실계산 | 수수료 빗썸 0.25% + Gate 0.2% = 0.45% 반영 | 3초 갱신 | 순수익 양수만 최대 15개 표시
</div>

<script>
(function() {
  let data = null;
  let sortKey = 'netPct';
  let sortDir = -1;
  let prevSymbols = new Set();
  let ws, reconTimer;

  const $ = id => document.getElementById(id);

  // --- Formatters ---
  function fKRW(n) {
    if (n == null) return '-';
    const a = Math.abs(n);
    if (a >= 1e8) return (n/1e8).toFixed(2) + '억';
    if (a >= 1e4) return (n/1e4).toFixed(0) + '만';
    return n.toLocaleString('ko-KR');
  }
  function fPrice(n) {
    if (n == null) return '-';
    if (n >= 1000) return Math.round(n).toLocaleString('ko-KR');
    if (n >= 1) return n.toFixed(2);
    if (n >= 0.01) return n.toFixed(4);
    return n.toFixed(6);
  }
  function fPct(n) {
    if (n == null) return '-';
    const c = n > 0 ? 'pos' : n < 0 ? 'neg' : 'dim';
    const s = n > 0 ? '+' : '';
    return `<span class="${c}">${s}${n.toFixed(3)}%</span>`;
  }
  function fVol(n) {
    if (n == null) return '-';
    if (n >= 1e12) return (n/1e12).toFixed(1) + '조';
    if (n >= 1e8) return (n/1e8).toFixed(1) + '억';
    if (n >= 1e4) return (n/1e4).toFixed(0) + '만';
    return Math.round(n).toLocaleString('ko-KR');
  }

  // --- Sort ---
  function sorted(arr) {
    return [...arr].sort((a,b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (sortKey === 'bithumbIO') {
        va = (a.bithumbDeposit?1:0) + (a.bithumbWithdrawal?1:0);
        vb = (b.bithumbDeposit?1:0) + (b.bithumbWithdrawal?1:0);
      }
      if (sortKey === 'gateioIO') {
        va = (a.gateioDeposit?1:0) + (a.gateioWithdrawal?1:0);
        vb = (b.gateioDeposit?1:0) + (b.gateioWithdrawal?1:0);
      }
      if (typeof va === 'string') return sortDir * va.localeCompare(vb);
      return sortDir * ((va||0) - (vb||0));
    });
  }

  // --- Render ---
  function render() {
    if (!data || !data.pairs) return;

    $('rate').textContent = data.usdtKrw ? data.usdtKrw.toLocaleString('ko-KR') : '-';
    $('lending').textContent = data.lendingCount || '-';
    $('profitCnt').textContent = data.positiveCount || '0';
    if (data.timestamp) {
      $('updated').textContent = new Date(data.timestamp).toLocaleTimeString('ko-KR');
    }

    // Sort arrows
    document.querySelectorAll('thead th').forEach(th => {
      const ar = th.querySelector('.arr');
      ar.textContent = th.dataset.k === sortKey ? (sortDir === -1 ? ' ▼' : ' ▲') : '';
    });

    const pairs = sorted(data.pairs);
    const newSymbols = new Set(pairs.map(p => p.symbol));

    if (pairs.length === 0) {
      $('tbl').style.display = 'none';
      $('loading').style.display = 'none';
      $('nodata').style.display = '';
      return;
    }

    $('loading').style.display = 'none';
    $('nodata').style.display = 'none';
    $('tbl').style.display = '';

    // Max net% for bar width
    const maxNet = Math.max(...pairs.map(p => Math.abs(p.netPct)), 0.1);

    $('body').innerHTML = pairs.map((p, i) => {
      const isNew = !prevSymbols.has(p.symbol);
      const dirCls = p.direction.startsWith('Gate') ? 'dir-g' : 'dir-b';
      const diffCls = p.priceDiff > 0 ? 'pos' : p.priceDiff < 0 ? 'neg' : 'dim';
      const profCls = p.profitPer1M > 0 ? 'pos' : p.profitPer1M < 0 ? 'neg' : 'dim';
      const barW = Math.max(2, Math.round((Math.abs(p.netPct) / maxNet) * 40));
      const barCls = p.netPct > 0 ? 'pos-bar' : 'neg-bar';

      // 입출금 표시
      const bD = p.bithumbDeposit;
      const bW = p.bithumbWithdrawal;
      const gD = p.gateioDeposit;
      const gW = p.gateioWithdrawal;

      return `<tr class="${isNew ? 'flash' : ''} ${p.netPct > 1 ? 'highlight' : ''}">
        <td>${i+1}. ${p.symbol}</td>
        <td>${fPrice(p.buyPrice)}</td>
        <td>${fPrice(p.sellPrice)}</td>
        <td class="${diffCls}">${p.priceDiff > 0 ? '+' : ''}${fKRW(p.priceDiff)}</td>
        <td><span class="dir ${dirCls}">${p.direction}</span></td>
        <td>${fPct(p.grossPct)}</td>
        <td><span class="profit-bar ${barCls}" style="width:${barW}px"></span>${fPct(p.netPct)}</td>
        <td class="${profCls}">${p.profitPer1M > 0 ? '+' : ''}${fKRW(p.profitPer1M)}원</td>
        <td><div class="io-cell"><span class="st ${bD ? 'st-ok' : 'st-no'}">입${bD ? 'O' : 'X'}</span><span class="st ${bW ? 'st-ok' : 'st-no'}">출${bW ? 'O' : 'X'}</span></div></td>
        <td><div class="io-cell"><span class="st ${gD ? 'st-ok' : 'st-no'}">입${gD ? 'O' : 'X'}</span><span class="st ${gW ? 'st-ok' : 'st-no'}">출${gW ? 'O' : 'X'}</span></div></td>
        <td class="dim">${fVol(p.bithumbVolume24h)}</td>
      </tr>`;
    }).join('');

    prevSymbols = newSymbols;
  }

  // --- Sort click ---
  document.querySelectorAll('thead th[data-k]').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir *= -1;
      else { sortKey = k; sortDir = k === 'symbol' ? 1 : -1; }
      render();
    });
  });

  // --- WebSocket ---
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.onopen = () => {
      $('wsDot').className = 'dot on';
      $('wsTxt').textContent = '연결됨';
      if (reconTimer) { clearTimeout(reconTimer); reconTimer = null; }
    };
    ws.onmessage = (e) => {
      try { data = JSON.parse(e.data); render(); } catch {}
    };
    ws.onclose = () => {
      $('wsDot').className = 'dot off';
      $('wsTxt').textContent = '재연결...';
      reconTimer = setTimeout(connectWS, 2000);
    };
    ws.onerror = () => ws.close();
  }

  // REST fallback
  async function init() {
    try {
      const r = await fetch('/api/arbitrage');
      const j = await r.json();
      if (j.pairs && j.pairs.length > 0) { data = j; render(); }
    } catch {}
  }

  init();
  connectWS();
})();
</script>
</body>
</html>
